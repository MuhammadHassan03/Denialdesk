[project]
name = "denialdesk-pipeline"
version = "0.1.0"
description = "Denialdesk pipeline: parse remittances, rank denials, draft and check fixes."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "pydantic>=2.14.2",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/denialdesk_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
